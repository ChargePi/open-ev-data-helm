name: Lint & Test Chart

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint-test.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/lint-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (lint)
        run: ct lint --charts charts/open-ev-data --validate-maintainers=false

      - name: helm template (default values)
        run: helm template test charts/open-ev-data

      - name: helm template (bring-your-own data source)
        run: |
          helm template test charts/open-ev-data \
            --set api.database.fetch.enabled=false \
            --set-json 'api.extraVolumes=[{"name":"dataset","persistentVolumeClaim":{"claimName":"my-pvc"}}]' \
            --set-json 'api.extraVolumeMounts=[{"name":"dataset","mountPath":"/data","readOnly":true}]'

  mock-deploy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chart-testing

      - name: Install chart
        run: |
          helm install ev-mock charts/open-ev-data \
            --namespace ev-mock --create-namespace \
            --wait --timeout 5m

      - name: Verify workloads are ready
        run: |
          kubectl -n ev-mock get all
          kubectl -n ev-mock rollout status deployment/ev-mock-api --timeout=120s

      - name: Smoke test the API health endpoint
        run: |
          kubectl -n ev-mock port-forward svc/ev-mock-api 3000:3000 &
          PF_PID=$!
          sleep 5
          curl -sf http://localhost:3000/api/v1/health
          kill $PF_PID

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n ev-mock get all
          kubectl -n ev-mock describe pods
          kubectl -n ev-mock logs -l app.kubernetes.io/name=api --tail=200 || true
          kubectl -n ev-mock logs -l app.kubernetes.io/name=api --tail=200 -c fetch-dataset || true

      - name: Uninstall
        if: always()
        run: helm uninstall ev-mock --namespace ev-mock --ignore-not-found
