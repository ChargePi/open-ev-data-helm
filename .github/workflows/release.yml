name: Release Chart

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version to publish (e.g. 0.2.0). Defaults to the pushed tag."
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Charts are published as oci://ghcr.io/<owner>/open-ev-data-helm/<chart>
  REPO_OWNER: chargepi

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - open-ev-data
          - openev-data-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build chart dependencies
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm dependency build "charts/${{ matrix.chart }}"

      # Charts with required values (e.g. openev-data-mcp's Gemini API key) are
      # linted with their ci/*-values.yaml examples instead of the defaults.
      - name: Lint chart
        run: |
          CHART="charts/${{ matrix.chart }}"
          if ls "${CHART}"/ci/*-values.yaml >/dev/null 2>&1; then
            for values in "${CHART}"/ci/*-values.yaml; do
              helm lint "${CHART}" -f "${values}"
            done
          else
            helm lint "${CHART}"
          fi

      - name: Package chart
        run: |
          helm package "charts/${{ matrix.chart }}" \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination .cr-release-packages

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: |
          helm push \
            ".cr-release-packages/${{ matrix.chart }}-${{ steps.version.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/open-ev-data-helm"

      - name: Summary
        run: |
          echo "Published oci://${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/open-ev-data-helm/${{ matrix.chart }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
