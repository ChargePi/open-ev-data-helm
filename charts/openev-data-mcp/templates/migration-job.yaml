{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp.fullname" . }}-migrate
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        # Not the mcp selector labels: the Service would route traffic to this pod.
        app.kubernetes.io/name: mcp-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/migrate.sh"]
          env:
            - name: DB_HOST
              value: {{ include "mcp.postgresHost" . | quote }}
            - name: DB_PORT
              value: {{ include "mcp.postgresPort" . | quote }}
            - name: DB_NAME
              value: {{ include "mcp.postgresDatabase" . | quote }}
            - name: GIT_REF
              value: {{ include "mcp.migrationGitRef" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.postgresSecretName" . }}
                  key: {{ include "mcp.postgresUserKey" . }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.postgresSecretName" . }}
                  key: {{ include "mcp.postgresPasswordKey" . }}
          volumeMounts:
            - name: migrate-script
              mountPath: /scripts
      volumes:
        - name: migrate-script
          configMap:
            name: {{ include "mcp.fullname" . }}-migrate
            defaultMode: 0755
{{- end }}
