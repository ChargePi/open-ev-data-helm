apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp.fullname" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.mcp.service.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "mcp.selectorLabels" . | nindent 4 }}
