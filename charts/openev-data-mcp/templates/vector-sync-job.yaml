{{- if .Values.vectorSync.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp.fullname" . }}-vector-sync
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector-sync
  annotations:
    # -- Runs after the database migration on install (hook weight 1) and on
    # every upgrade; the sync is incremental, so re-running it is cheap.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.vectorSync.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.vectorSync.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-vector-sync
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vector-sync
    spec:
      {{- include "mcp.vectorSyncPodSpec" . | nindent 6 }}
{{- end }}
