{{- if and .Values.mcp.config.embedding.apiKey (not .Values.mcp.config.embedding.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp.embeddingSecretName" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.mcp.config.embedding.apiKey | b64enc | quote }}
{{- end }}
